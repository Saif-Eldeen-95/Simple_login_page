<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1 class="title">Welcome To My Web App</h1>

  <form id="loginForm" class="form" novalidate>
    <h2>Login</h2>

    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="Enter your email">
      <span class="field-error" id="error-email"></span>
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Enter password">
      <span class="field-error" id="error-password"></span>
    </div>

    <div id="errors" class="errors"></div>

    <div class="button-group">
      <button type="submit" class="btn">Submit</button>
      <button type="button" class="btn" onclick="location.href='register.html'">Register</button>
    </div>
  </form>
  <footer>
    <p> Saif Eldeen Shady. All rights reserved.</p>
  </footer>
  <script src="script.js"></script>
</body>
</html>
