<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1 class="title">Welcome To My Web App</h1>

  <form id="registerForm" class="form" novalidate>
    <h2>Create Account</h2>

    <div class="form-group">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" placeholder="Enter your name">
      <span class="field-error" id="error-name"></span>
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="Enter your email">
      <span class="field-error" id="error-email"></span>
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Enter password">
      <span class="field-error" id="error-password"></span>
    </div>

    <div class="form-group">
      <label for="confirm_password">Confirm Password</label>
      <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm password">
      <span class="field-error" id="error-confirm_password"></span>
    </div>

    <div id="errors" class="errors"></div>

    <div class="button-group">
      <button type="submit" class="btn">Submit</button>
      <button type="button" class="btn" onclick="location.href='index.html'">Back to Login</button>
    </div>
  </form>

  <script src="script.js"></script>
</body>
</html>
